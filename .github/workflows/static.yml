# The old GitHub Pages address, https://jmhatake123.github.io/Website/ (26 Nov 2026): the website itself is published to
# Firebase Hosting, https://citu-smart-irrigation.web.app (firebase deploy --only hosting, see README.md). GitHub Pages
# now serves only github-pages-redirect/, which forwards every old link and bookmark to the same page at the new address.
name: Forward the old GitHub Pages address to citu-smart-irrigation.web.app

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the forwarding page, never the site itself
          path: 'github-pages-redirect'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
