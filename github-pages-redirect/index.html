<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIT-U EE Smart Irrigation has moved</title>
  <!-- The old GitHub Pages address (26 Nov 2026): the website now lives at https://citu-smart-irrigation.web.app
       (Firebase Hosting). .github/workflows/static.yml publishes only this folder to GitHub Pages, so an old link or
       bookmark lands on the same page at the new address. 404.html is the same file, for any deeper link. -->
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://citu-smart-irrigation.web.app/">
  <meta http-equiv="refresh" content="0; url=https://citu-smart-irrigation.web.app/">
  <script>
    (function () {
      var path = location.pathname.replace(/^\/Website(\/|$)/i, "/");
      location.replace("https://citu-smart-irrigation.web.app" + path + location.search + location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f6f0; color: #122034;
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    a { color: #1f7f45; font-weight: 700; }
  </style>
</head>
<body>
  <p>CIT-U EE Smart Irrigation has moved to<br><a href="https://citu-smart-irrigation.web.app/">citu-smart-irrigation.web.app</a></p>
</body>
</html>
